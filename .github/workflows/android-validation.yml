name: Official Android validation

on:
  pull_request:
    branches: [main, 'work/**']
  push:
    branches:
      - main
      - 'work/**'
      - 'fix/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: official-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android build and OAuth bridge checks
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Embed pinned NovelAI image-generation backend
        shell: bash
        run: |
          set -euo pipefail
          source_commit="26d6c32e0b0abbb886e3029efd548b7ca6774401"
          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/diethoon/wayward/${source_commit}/mods.zip" \
            -o "$RUNNER_TEMP/wayward-mods.zip"
          python3 scripts/embed_imagegen_backend.py "$RUNNER_TEMP/wayward-mods.zip"

      - name: Check branch diff whitespace
        run: git diff --check origin/main...HEAD

      - name: Check JavaScript syntax
        run: |
          node --check app/src/main/assets/wayward-google-auth-bridge.js
          node --check app/src/main/assets/wml-folder-bootstrap.js
          node --check app/src/main/assets/imagegen-proxy.js
          node --check app/src/main/assets/imagegen-studio-bridge.js

      - name: Test official launcher scope
        run: |
          node scripts/test-official-scope.cjs
          python3 -m py_compile scripts/check-glass-ui-layout.py

      - name: Test Google OAuth bridge contract
        run: node scripts/test-google-auth-bridge.cjs

      - name: Test Image Studio server/image-pack mode isolation
        run: node tests/imagegen-studio-mode.test.mjs
      - name: Test managed NovelAI provider lock
        run: |
          node tests/novelai-provider-lock.test.mjs
          node tests/novelai-token-persistence.test.mjs

      - name: Test image server switch ordering
        run: |
          test_dir="$RUNNER_TEMP/image-server-mode-test"
          mkdir -p "$test_dir"
          javac -d "$test_dir" app/src/main/java/com/wayward/launcher/ImageServerModeCoordinator.java tests/ImageServerModeCoordinatorTest.java
          java -cp "$test_dir" com.wayward.launcher.ImageServerModeCoordinatorTest

      - name: Test SAF image direct document-ID resolver
        run: |
          test_dir="$RUNNER_TEMP/saf-image-resolver-test"
          mkdir -p "$test_dir"
          javac -d "$test_dir" app/src/main/java/com/wayward/launcher/SafImageDocumentResolver.java tests/SafImageDocumentResolverTest.java
          java -cp "$test_dir" com.wayward.launcher.SafImageDocumentResolverTest
          node tests/saf-image-fast-path.contract.test.cjs

      - name: Prepare optional release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [[ -n "$KEYSTORE_BASE64" && -n "$KEYSTORE_PASSWORD" && -n "$KEY_ALIAS" ]]; then
            work_dir="$RUNNER_TEMP/wayward-release"
            mkdir -p "$work_dir"
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$work_dir/uploaded.p12"
            chmod 600 "$work_dir/uploaded.p12"
            actual_bytes="$(wc -c < "$work_dir/uploaded.p12" | tr -d '[:space:]')"
            echo "Decoded uploaded P12 size: $actual_bytes bytes (original Termux report: 2858 bytes)." >> "$GITHUB_STEP_SUMMARY"

            # Verify the uploaded P12 password and extract the key/certificate
            # without ever printing PEM material into the Actions log.
            openssl pkcs12 -in "$work_dir/uploaded.p12" -info -noout \
              -passin env:KEYSTORE_PASSWORD >/dev/null 2>"$work_dir/p12-check.log" || {
                echo "OpenSSL could not verify the uploaded P12 using ANDROID_KEYSTORE_PASSWORD." >&2
                cat "$work_dir/p12-check.log" >&2
                exit 1
              }
            openssl pkcs12 -in "$work_dir/uploaded.p12" -nocerts -nodes \
              -passin env:KEYSTORE_PASSWORD -out "$work_dir/release-key.pem"
            openssl pkcs12 -in "$work_dir/uploaded.p12" -clcerts -nokeys \
              -passin env:KEYSTORE_PASSWORD -out "$work_dir/release-cert.pem"
            chmod 600 "$work_dir/release-key.pem" "$work_dir/release-cert.pem"
            openssl pkey -in "$work_dir/release-key.pem" -noout -check >/dev/null

            key_public_hash="$(openssl pkey -in "$work_dir/release-key.pem" -pubout -outform DER | openssl dgst -sha256)"
            cert_public_hash="$(openssl x509 -in "$work_dir/release-cert.pem" -pubkey -noout | openssl pkey -pubin -outform DER | openssl dgst -sha256)"
            if [[ "$key_public_hash" != "$cert_public_hash" ]]; then
              echo "Release private key does not match the certificate inside the uploaded P12." >&2
              exit 1
            fi

            actual_sha1="$(openssl x509 -in "$work_dir/release-cert.pem" -noout -fingerprint -sha1 | sed 's/.*=//' | tr -d ':' | tr '[:lower:]' '[:upper:]')"
            expected_sha1="D9BE7443EB247D27C958CC4250D7F5D1E078F740"
            if [[ "$actual_sha1" != "$expected_sha1" ]]; then
              echo "Release certificate SHA-1 does not match the registered Android OAuth client." >&2
              echo "Expected: $expected_sha1; actual: ${actual_sha1:-missing}" >&2
              exit 1
            fi

            # Repackage with the legacy 3DES PBE profile supported by the
            # Java 17 PKCS#12 importer, then convert to a temporary JKS.
            openssl pkcs12 -export \
              -inkey "$work_dir/release-key.pem" \
              -in "$work_dir/release-cert.pem" \
              -name "$KEY_ALIAS" \
              -passout env:KEYSTORE_PASSWORD \
              -keypbe PBE-SHA1-3DES \
              -certpbe PBE-SHA1-3DES \
              -macalg sha1 \
              -out "$work_dir/java-compatible.p12"
            chmod 600 "$work_dir/java-compatible.p12"
            keytool -importkeystore -noprompt \
              -srckeystore "$work_dir/java-compatible.p12" \
              -srcstoretype PKCS12 \
              -srcstorepass "$KEYSTORE_PASSWORD" \
              -srcalias "$KEY_ALIAS" \
              -destkeystore "$work_dir/release.jks" \
              -deststoretype JKS \
              -deststorepass "$KEYSTORE_PASSWORD" \
              -destkeypass "$KEYSTORE_PASSWORD" \
              -destalias "$KEY_ALIAS"

            cert_info="$(keytool -list -v \
              -keystore "$work_dir/release.jks" \
              -storetype JKS \
              -storepass "$KEYSTORE_PASSWORD" \
              -alias "$KEY_ALIAS")"
            jks_sha1="$(printf '%s\\n' "$cert_info" | awk '/SHA1:/ {print $2; exit}' | tr -d ':' | tr '[:lower:]' '[:upper:]')"
            if [[ "$jks_sha1" != "$expected_sha1" ]]; then
              echo "Temporary JKS certificate SHA-1 mismatch." >&2
              echo "Expected: $expected_sha1; actual: ${jks_sha1:-missing}" >&2
              exit 1
            fi

            chmod 600 "$work_dir/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$work_dir/release.jks" >> "$GITHUB_ENV"
            echo "RELEASE_SIGNING_CONFIGURED=true" >> "$GITHUB_ENV"
            echo "Release P12 validated (2858 bytes), private key matched its certificate, and SHA-1 matched OAuth." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "RELEASE_SIGNING_CONFIGURED=false" >> "$GITHUB_ENV"
            echo "Release signing secrets are incomplete; the Release APK will be unsigned. Debug APK build and tests still run." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-provider: basic

      - name: Build Debug and Release APKs
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: gradle --no-daemon --stacktrace clean assembleDebug assembleRelease

      - name: Verify signed Release APK identity
        if: env.RELEASE_SIGNING_CONFIGURED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          release_apk="app/build/outputs/apk/release/app-release.apk"
          test -s "$release_apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$release_apk" > "$RUNNER_TEMP/release-signing.txt"
          cat "$RUNNER_TEMP/release-signing.txt"
          actual_sha1="$(awk -F': ' '/Signer #1 certificate SHA-1 digest:/ {gsub(/:/, "", $2); gsub(/[[:space:]]/, "", $2); print toupper($2); exit}' "$RUNNER_TEMP/release-signing.txt")"
          expected_sha1="D9BE7443EB247D27C958CC4250D7F5D1E078F740"
          test "$actual_sha1" = "$expected_sha1"
          echo "Release APK signature matches the registered Android OAuth SHA-1." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Debug and Release APKs
        uses: actions/upload-artifact@v7
        with:
          name: wayward-launcher-official-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android 15 emulator startup smoke test
        id: android15_smoke
        timeout-minutes: 4
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb wait-for-device
            boot_completed=""
            for attempt in $(seq 1 60); do
              boot_completed="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\\r' || true)"
              if [[ "$boot_completed" == "1" ]]; then break; fi
              sleep 2
            done
            test "$boot_completed" = "1"

            # The stock Pixel Launcher can trigger a system ANR dialog in headless
            # CI even when the app under test is healthy. Stop home launchers before
            # opening Wayward; this test only needs the app's own MainActivity.
            adb shell am force-stop com.google.android.apps.nexuslauncher || true
            adb shell am force-stop com.android.launcher3 || true
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.wayward.launcher.official.debug || true
            adb shell am start -W -n com.wayward.launcher.official.debug/com.wayward.launcher.MainActivity
            sleep 6
            adb shell pidof -s com.wayward.launcher.official.debug > /tmp/wayward-launcher-app-pid.txt
            adb logcat -d -s AndroidRuntime:E > /tmp/wayward-launcher-crash.log
            test -s /tmp/wayward-launcher-app-pid.txt && ! grep -q "Process: com.wayward.launcher.official.debug" /tmp/wayward-launcher-crash.log
            adb shell uiautomator dump /sdcard/wayward-launcher-home.xml >/dev/null
            adb pull /sdcard/wayward-launcher-home.xml /tmp/wayward-launcher-home.xml

            # Recover once if Android left the Pixel Launcher ANR dialog on top.
            if grep -q "Pixel Launcher isn't responding" /tmp/wayward-launcher-home.xml; then
              adb shell input tap 540 1363 || true
              sleep 3
              adb shell am force-stop com.google.android.apps.nexuslauncher || true
              adb shell am force-stop com.android.launcher3 || true
              adb shell am force-stop com.wayward.launcher.official.debug || true
              adb shell am start -W -n com.wayward.launcher.official.debug/com.wayward.launcher.MainActivity
              sleep 5
              adb shell uiautomator dump /sdcard/wayward-launcher-home.xml >/dev/null
              adb pull /sdcard/wayward-launcher-home.xml /tmp/wayward-launcher-home.xml
            fi

            mkdir -p artifacts
            adb exec-out screencap -p > artifacts/android15-launcher-home.png
            cp /tmp/wayward-launcher-home.xml artifacts/android15-launcher-home.xml
            echo "=== Android 15 UI hierarchy ==="
            cat /tmp/wayward-launcher-home.xml
            ! grep -q "Pixel Launcher isn't responding" /tmp/wayward-launcher-home.xml
            grep -q "이미지 생성 서버 실행" /tmp/wayward-launcher-home.xml
            grep -q "이미지팩만 사용" /tmp/wayward-launcher-home.xml
            grep -q "NovelAI 토큰 설정" /tmp/wayward-launcher-home.xml
            python3 scripts/check-glass-ui-layout.py /tmp/wayward-launcher-home.xml
            test -s artifacts/android15-launcher-home.png
            echo "Android 15 emulator launched the official launcher and confirmed both image mode controls plus the NovelAI settings gear. Home screenshot captured."

      - name: Report Android emulator smoke-test warning
        if: steps.android15_smoke.outcome == 'failure'
        run: echo "::warning::Android 15 emulator/ADB smoke test failed; APK build and deterministic routing tests remain independently reported."

      - name: Upload Android 15 UI diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wayward-launcher-android15-ui-diagnostics
          path: |
            artifacts/android15-launcher-home.png
            artifacts/android15-launcher-home.xml
          if-no-files-found: warn
          retention-days: 14
