name: Official Android validation

on:
  pull_request:
    branches: [main, 'work/**']
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '*.md'
  push:
    branches:
      - main
      - 'work/**'
      - 'fix/**'
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: official-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android build and OAuth bridge checks
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Embed pinned NovelAI image-generation backend
        shell: bash
        run: |
          set -euo pipefail
          source_commit="26d6c32e0b0abbb886e3029efd548b7ca6774401"
          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/diethoon/wayward/${source_commit}/mods.zip" \
            -o "$RUNNER_TEMP/wayward-mods.zip"
          python3 scripts/embed_imagegen_backend.py "$RUNNER_TEMP/wayward-mods.zip"

      - name: Check branch diff whitespace
        run: git diff --check origin/main...HEAD

      - name: Check JavaScript syntax
        run: |
          node --check app/src/main/assets/wayward-google-auth-bridge.js
          node --check app/src/main/assets/wml-folder-bootstrap.js
          node --check app/src/main/assets/imagegen-proxy.js
          node --check app/src/main/assets/imagegen-studio-bridge.js
          node --check app/src/main/assets/imagepack-folder-picker.js
          node --check app/src/main/assets/wayward-download-bridge.js

      - name: Sequential 4096-byte source forensic scan
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          for name in (
              "app/src/main/assets/imagepack-folder-picker.js",
              "app/src/main/java/com/wayward/launcher/ImagePackDirectoryAccess.java",
          ):
              offset = 0
              print(f"FILE {name}")
              with Path(name).open("rb") as source:
                  while True:
                      chunk = source.read(4096)
                      if not chunk:
                          break
                      print(f"CHUNK offset={offset} length={len(chunk)} sha256={hashlib.sha256(chunk).hexdigest()}")
                      offset += len(chunk)
              print(f"EOF bytes={offset}")
          PY

      - name: Test official launcher scope
        run: |
          node scripts/test-official-scope.cjs
          python3 -m py_compile scripts/check-glass-ui-layout.py

      - name: Test Remote Play native bridge contract
        run: node tests/remote-play-contract.test.cjs

      - name: Test Google OAuth bridge contract
        run: node scripts/test-google-auth-bridge.cjs

      - name: Test CloudSave native account-selection policy
        run: node tests/cloudsave-native-auth-selection.test.cjs

      - name: Test Image Studio server/image-pack mode isolation
        run: node tests/imagegen-studio-mode.test.mjs
      - name: Test managed NovelAI provider lock
        run: |
          node tests/novelai-provider-lock.test.mjs
          node tests/novelai-token-persistence.test.mjs

      - name: Test image server switch ordering
        run: |
          test_dir="$RUNNER_TEMP/image-server-mode-test"
          mkdir -p "$test_dir"
          javac -d "$test_dir" app/src/main/java/com/wayward/launcher/ImageServerModeCoordinator.java tests/ImageServerModeCoordinatorTest.java
          java -cp "$test_dir" com.wayward.launcher.ImageServerModeCoordinatorTest

      - name: Test WebView file and folder chooser request policy
        run: |
          node tests/web-file-chooser-contract.test.mjs
          node tests/wayward-source-contract.test.mjs
          test_dir="$RUNNER_TEMP/web-file-chooser-policy-test"
          mkdir -p "$test_dir"
          javac -d "$test_dir" app/src/main/java/com/wayward/launcher/WebFileChooserRequestPolicy.java tests/WebFileChooserRequestPolicyTest.java
          java -cp "$test_dir" com.wayward.launcher.WebFileChooserRequestPolicyTest

      - name: Test native image-pack SAF folder bridge contract
        run: node tests/imagepack-folder-picker-contract.test.mjs
      - name: Test asynchronous SAF batch protocol and 100k synthetic traversal
        run: node tests/file-access-engine-batch.test.mjs
      - name: Test generic file-access policy isolation and large-tree safety
        run: node tests/file-access-engine-policy.test.mjs
      - name: Test FAITH 3.0.0 webkitdirectory FileList adapter
        run: node tests/faith-imagepack-upload-contract.test.mjs

      - name: Test Android 15 Recents task parser
        run: python3 tests/android15-recents-parser.test.py

      - name: Test automatic diagnostics upload severity policy
        run: |
          test_dir="$RUNNER_TEMP/diagnostics-upload-policy-test"
          mkdir -p "$test_dir"
          javac -d "$test_dir" app/src/main/java/com/wayward/launcher/DiagnosticsUploadPolicy.java tests/DiagnosticsUploadPolicyTest.java
          java -cp "$test_dir" com.wayward.launcher.DiagnosticsUploadPolicyTest

      - name: Test SAF image direct document-ID resolver
        run: |
          test_dir="$RUNNER_TEMP/saf-image-resolver-test"
          mkdir -p "$test_dir"
          javac -d "$test_dir" app/src/main/java/com/wayward/launcher/SafImageDocumentResolver.java tests/SafImageDocumentResolverTest.java
          java -cp "$test_dir" com.wayward.launcher.SafImageDocumentResolverTest
          node tests/saf-image-fast-path.contract.test.cjs

      - name: Prepare optional release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [[ -n "$KEYSTORE_BASE64" && -n "$KEYSTORE_PASSWORD" && -n "$KEY_ALIAS" ]]; then
            work_dir="$RUNNER_TEMP/wayward-release"
            mkdir -p "$work_dir"
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$work_dir/uploaded.p12"
            chmod 600 "$work_dir/uploaded.p12"
            actual_bytes="$(wc -c < "$work_dir/uploaded.p12" | tr -d '[:space:]')"
            echo "Decoded uploaded P12 size: $actual_bytes bytes (original Termux report: 2858 bytes)." >> "$GITHUB_STEP_SUMMARY"

            # Verify the uploaded P12 password and extract the key/certificate
            # without ever printing PEM material into the Actions log.
            openssl pkcs12 -in "$work_dir/uploaded.p12" -info -noout \
              -passin env:KEYSTORE_PASSWORD >/dev/null 2>"$work_dir/p12-check.log" || {
                echo "OpenSSL could not verify the uploaded P12 using ANDROID_KEYSTORE_PASSWORD." >&2
                cat "$work_dir/p12-check.log" >&2
                exit 1
              }
            openssl pkcs12 -in "$work_dir/uploaded.p12" -nocerts -nodes \
              -passin env:KEYSTORE_PASSWORD -out "$work_dir/release-key.pem"
            openssl pkcs12 -in "$work_dir/uploaded.p12" -clcerts -nokeys \
              -passin env:KEYSTORE_PASSWORD -out "$work_dir/release-cert.pem"
            chmod 600 "$work_dir/release-key.pem" "$work_dir/release-cert.pem"
            openssl pkey -in "$work_dir/release-key.pem" -noout -check >/dev/null

            key_public_hash="$(openssl pkey -in "$work_dir/release-key.pem" -pubout -outform DER | openssl dgst -sha256)"
            cert_public_hash="$(openssl x509 -in "$work_dir/release-cert.pem" -pubkey -noout | openssl pkey -pubin -outform DER | openssl dgst -sha256)"
            if [[ "$key_public_hash" != "$cert_public_hash" ]]; then
              echo "Release private key does not match the certificate inside the uploaded P12." >&2
              exit 1
            fi

            actual_sha1="$(openssl x509 -in "$work_dir/release-cert.pem" -noout -fingerprint -sha1 | sed 's/.*=//' | tr -d ':' | tr '[:lower:]' '[:upper:]')"
            expected_sha1="D9BE7443EB247D27C958CC4250D7F5D1E078F740"
            if [[ "$actual_sha1" != "$expected_sha1" ]]; then
              echo "Release certificate SHA-1 does not match the registered Android OAuth client." >&2
              echo "Expected: $expected_sha1; actual: ${actual_sha1:-missing}" >&2
              exit 1
            fi

            # Repackage with the legacy 3DES PBE profile supported by the
            # Java 17 PKCS#12 importer, then convert to a temporary JKS.
            openssl pkcs12 -export \
              -inkey "$work_dir/release-key.pem" \
              -in "$work_dir/release-cert.pem" \
              -name "$KEY_ALIAS" \
              -passout env:KEYSTORE_PASSWORD \
              -keypbe PBE-SHA1-3DES \
              -certpbe PBE-SHA1-3DES \
              -macalg sha1 \
              -out "$work_dir/java-compatible.p12"
            chmod 600 "$work_dir/java-compatible.p12"
            keytool -importkeystore -noprompt \
              -srckeystore "$work_dir/java-compatible.p12" \
              -srcstoretype PKCS12 \
              -srcstorepass "$KEYSTORE_PASSWORD" \
              -srcalias "$KEY_ALIAS" \
              -destkeystore "$work_dir/release.jks" \
              -deststoretype JKS \
              -deststorepass "$KEYSTORE_PASSWORD" \
              -destkeypass "$KEYSTORE_PASSWORD" \
              -destalias "$KEY_ALIAS"

            cert_info="$(keytool -list -v \
              -keystore "$work_dir/release.jks" \
              -storetype JKS \
              -storepass "$KEYSTORE_PASSWORD" \
              -alias "$KEY_ALIAS")"
            jks_sha1="$(printf '%s\\n' "$cert_info" | awk '/SHA1:/ {print $2; exit}' | tr -d ':' | tr '[:lower:]' '[:upper:]')"
            if [[ "$jks_sha1" != "$expected_sha1" ]]; then
              echo "Temporary JKS certificate SHA-1 mismatch." >&2
              echo "Expected: $expected_sha1; actual: ${jks_sha1:-missing}" >&2
              exit 1
            fi

            chmod 600 "$work_dir/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$work_dir/release.jks" >> "$GITHUB_ENV"
            echo "RELEASE_SIGNING_CONFIGURED=true" >> "$GITHUB_ENV"
            echo "Release P12 validated (2858 bytes), private key matched its certificate, and SHA-1 matched OAuth." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "RELEASE_SIGNING_CONFIGURED=false" >> "$GITHUB_ENV"
            echo "Release signing secrets are incomplete; the Release APK will be unsigned. Debug APK build and tests still run." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-provider: basic

      - name: Build Debug and Release APKs
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: gradle --no-daemon --stacktrace clean testDebugUnitTest assembleDebug assembleRelease

      - name: Verify WWL branding in Debug and Release APKs
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c <<'SHA256'
          f1332d676a412aa554c510ca5a8bb72971b3a1dba159ab49da9d075c45cfc02d  app/src/main/res/drawable-hdpi-v4/ic_launcher_foreground.png
          6ce8f396b3685fb027cfbf45afb2b336540506b809ed384b7851f8676f250518  app/src/main/res/drawable-mdpi-v4/ic_launcher_foreground.png
          195ea6bee122f5c9a1af7d4d9c4c7932497294953cb19a0b74d5a350d2c96928  app/src/main/res/drawable-xhdpi-v4/ic_launcher_foreground.png
          a293a94f7d85940b24c947bb43dc506faa6fe4d0b2274395fb696fca9610fef7  app/src/main/res/drawable-xxhdpi-v4/ic_launcher_foreground.png
          cbc15823cc9d7b7b15194058023b1428430b2ff2ecc4b9e03a85b8ed00ca9508  app/src/main/res/drawable-xxxhdpi-v4/ic_launcher_foreground.png
          94fb235fcee0ebcd7b19d6b57634408448dfc56079cb0db9517d3b5af7623d5b  app/src/main/res/mipmap-hdpi-v4/ic_launcher.png
          2b52881865e45f1bc01d8b347e7323192898ad1d7983d00da725b7f38ed272c5  app/src/main/res/mipmap-mdpi-v4/ic_launcher.png
          d7e9ed3737679e811c1a28c414a48727d480c11b7e768f1557b8e07ed122d8dc  app/src/main/res/mipmap-xhdpi-v4/ic_launcher.png
          6674e7e4f3cdac3112137daefd464128e6798f321c7588f0e5dac7089933e347  app/src/main/res/mipmap-xxhdpi-v4/ic_launcher.png
          06b56917bf8427cc49030781d1763fc06ec26317c907955ad97bf38c18549d18  app/src/main/res/mipmap-xxxhdpi-v4/ic_launcher.png
          94fb235fcee0ebcd7b19d6b57634408448dfc56079cb0db9517d3b5af7623d5b  app/src/main/res/mipmap-hdpi-v4/ic_launcher_round.png
          2b52881865e45f1bc01d8b347e7323192898ad1d7983d00da725b7f38ed272c5  app/src/main/res/mipmap-mdpi-v4/ic_launcher_round.png
          d7e9ed3737679e811c1a28c414a48727d480c11b7e768f1557b8e07ed122d8dc  app/src/main/res/mipmap-xhdpi-v4/ic_launcher_round.png
          6674e7e4f3cdac3112137daefd464128e6798f321c7588f0e5dac7089933e347  app/src/main/res/mipmap-xxhdpi-v4/ic_launcher_round.png
          06b56917bf8427cc49030781d1763fc06ec26317c907955ad97bf38c18549d18  app/src/main/res/mipmap-xxxhdpi-v4/ic_launcher_round.png
          SHA256
          aapt="$ANDROID_HOME/build-tools/35.0.0/aapt"
          for variant in debug release; do
            apk="app/build/outputs/apk/$variant/app-$variant.apk"
            test -s "$apk"
            "$aapt" dump badging "$apk" | grep -F "application-label:'WWL'"
            unzip -l "$apk" | grep -q 'res/mipmap-anydpi-v26/ic_launcher.xml'
            unzip -l "$apk" | grep -q 'res/mipmap-anydpi-v26/ic_launcher_round.xml'
            unzip -l "$apk" | grep -q 'res/drawable-xxxhdpi-v4/ic_launcher_foreground.png'
            "$aapt" dump resources "$apk" | grep -A1 -F 'color/launcher_icon_background' | grep -F '#ff24170f'
            sha256sum "$apk"
            stat -c '%n %s bytes' "$apk"
          done
          "$aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | grep -F "package: name='com.wayward.launcher.official.debug' versionCode='107' versionName='1.0.7-debug'"
          "$aapt" dump badging app/build/outputs/apk/release/app-release.apk | grep -F "package: name='com.wayward.launcher.official' versionCode='107' versionName='1.0.7'"

      - name: Verify signed Release APK identity
        if: env.RELEASE_SIGNING_CONFIGURED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          release_apk="app/build/outputs/apk/release/app-release.apk"
          test -s "$release_apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$release_apk" > "$RUNNER_TEMP/release-signing.txt"
          cat "$RUNNER_TEMP/release-signing.txt"
          actual_sha1="$(awk -F': ' '/Signer #1 certificate SHA-1 digest:/ {gsub(/:/, "", $2); gsub(/[[:space:]]/, "", $2); print toupper($2); exit}' "$RUNNER_TEMP/release-signing.txt")"
          expected_sha1="D9BE7443EB247D27C958CC4250D7F5D1E078F740"
          test "$actual_sha1" = "$expected_sha1"
          echo "Release APK signature matches the registered Android OAuth SHA-1." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Debug and Release APKs
        uses: actions/upload-artifact@v7
        with:
          name: wayward-launcher-official-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Enable KVM for Android emulator
        if: github.ref != 'refs/heads/work/android-faith-finalize-20261119' && github.head_ref != 'work/android-faith-finalize-20261119' && github.ref != 'refs/heads/work/android-file-engine-v2.1-complete-20261119' && github.head_ref != 'work/android-file-engine-v2.1-complete-20261119'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android 15 emulator startup and Native crypto tests
        if: github.ref != 'refs/heads/fix/android-qr-pairing-20261116' && github.ref != 'refs/heads/work/android-faith-finalize-20261119' && github.head_ref != 'work/android-faith-finalize-20261119' && github.ref != 'refs/heads/work/android-file-engine-v2.1-complete-20261119' && github.head_ref != 'work/android-file-engine-v2.1-complete-20261119'
        id: android15_smoke
        timeout-minutes: 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 scripts/android15-emulator-smoke.py

      - name: Report Android emulator smoke-test warning
        if: steps.android15_smoke.outcome == 'failure'
        run: echo "::warning::Android 15 emulator/ADB smoke test failed; APK build and deterministic routing tests remain independently reported."

      - name: Upload Android 15 UI diagnostics
        if: always() && github.ref != 'refs/heads/work/android-faith-finalize-20261119' && github.head_ref != 'work/android-faith-finalize-20261119' && github.ref != 'refs/heads/work/android-file-engine-v2.1-complete-20261119' && github.head_ref != 'work/android-file-engine-v2.1-complete-20261119'
        uses: actions/upload-artifact@v7
        with:
          name: wayward-launcher-android15-ui-diagnostics
          path: |
            artifacts/android15-launcher-home.png
            artifacts/android15-launcher-home.xml
            artifacts/android15-imagepack-folder-picker.png
            artifacts/android15-imagepack-folder-picker.xml
            artifacts/android15-game-tree-picker.xml
            artifacts/android15-game-tree-picker-after-use.xml
            artifacts/android15-game-tree-picker-after-use.png
            artifacts/android15-game-tree-picker-returned.xml
            artifacts/android15-documentsui-download-navigation.xml
            artifacts/android15-main-activity-game-before-picker.xml
            artifacts/android15-main-activity-imagepack-picker.xml
            artifacts/android15-main-activity-game-handle-pass.xml
            artifacts/android15-folder-picker-*
            artifacts/android15-game-route-*
            artifacts/android15-recents-after-game-back.txt
            artifacts/android15-zip-multiselect.xml
            artifacts/android15-single-file-*
            artifacts/android15-diagnostics-share-chooser.txt
            artifacts/android15-diagnostics-export.zip
            artifacts/imagepack-acceptance-pixel.png
            artifacts/imagepack-acceptance-logcat.txt
            app/build/reports/androidTests/connected/debug
            app/build/outputs/androidTest-results/connected/debug
          if-no-files-found: warn
          retention-days: 14
