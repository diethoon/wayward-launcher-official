name: Official Android validation

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'work/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: official-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android build and OAuth bridge checks
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Check branch diff whitespace
        run: git diff --check origin/main...HEAD

      - name: Check JavaScript syntax
        run: |
          node --check app/src/main/assets/wayward-google-auth-bridge.js
          node --check app/src/main/assets/wml-folder-bootstrap.js

      - name: Test official launcher scope
        run: node scripts/test-official-scope.cjs

      - name: Test Google OAuth bridge contract
        run: node scripts/test-google-auth-bridge.cjs

      - name: Prepare optional release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [[ -n "$KEYSTORE_BASE64" && -n "$KEYSTORE_PASSWORD" && -n "$KEY_ALIAS" ]]; then
            mkdir -p "$RUNNER_TEMP/wayward-release"
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/wayward-release/release.p12"
            test -s "$RUNNER_TEMP/wayward-release/release.p12"
            chmod 600 "$RUNNER_TEMP/wayward-release/release.p12"

            # Standard OpenSSL PKCS#12 exports use the export password for both
            # the container and private key. Convert to JKS for Gradle signing.
            keytool -importkeystore -noprompt \
              -srckeystore "$RUNNER_TEMP/wayward-release/release.p12" \
              -srcstoretype PKCS12 \
              -srcstorepass "$KEYSTORE_PASSWORD" \
              -srcalias "$KEY_ALIAS" \
              -srckeypass "$KEYSTORE_PASSWORD" \
              -destkeystore "$RUNNER_TEMP/wayward-release/release.jks" \
              -deststoretype JKS \
              -deststorepass "$KEYSTORE_PASSWORD" \
              -destkeypass "$KEYSTORE_PASSWORD" \
              -destalias "$KEY_ALIAS"

            cert_info="$(keytool -list -v \
              -keystore "$RUNNER_TEMP/wayward-release/release.jks" \
              -storetype JKS \
              -storepass "$KEYSTORE_PASSWORD" \
              -alias "$KEY_ALIAS")"
            actual_sha1="$(printf '%s\n' "$cert_info" | awk '/SHA1:/ {print $2; exit}' | tr -d ':' | tr '[:lower:]' '[:upper:]')"
            expected_sha1="D9BE7443EB247D27C958CC4250D7F5D1E078F740"
            if [[ "$actual_sha1" != "$expected_sha1" ]]; then
              echo "Release keystore certificate SHA-1 does not match the registered Android OAuth client." >&2
              echo "Expected: $expected_sha1; actual: ${actual_sha1:-missing}" >&2
              exit 1
            fi

            chmod 600 "$RUNNER_TEMP/wayward-release/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/wayward-release/release.jks" >> "$GITHUB_ENV"
            echo "RELEASE_SIGNING_CONFIGURED=true" >> "$GITHUB_ENV"
            echo "Release key imported to JKS; certificate SHA-1 verified: $expected_sha1" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "RELEASE_SIGNING_CONFIGURED=false" >> "$GITHUB_ENV"
            echo "Release signing secrets are incomplete; the Release APK will be unsigned. Debug APK build and tests still run." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-provider: basic

      - name: Build Debug and Release APKs
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: gradle --no-daemon --stacktrace clean assembleDebug assembleRelease

      - name: Verify signed Release APK identity
        if: env.RELEASE_SIGNING_CONFIGURED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          release_apk="app/build/outputs/apk/release/app-release.apk"
          test -s "$release_apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$release_apk" > "$RUNNER_TEMP/release-signing.txt"
          cat "$RUNNER_TEMP/release-signing.txt"
          actual_sha1="$(awk -F': ' '/Signer #1 certificate SHA-1 digest:/ {gsub(/:/, "", $2); gsub(/[[:space:]]/, "", $2); print toupper($2); exit}' "$RUNNER_TEMP/release-signing.txt")"
          expected_sha1="D9BE7443EB247D27C958CC4250D7F5D1E078F740"
          test "$actual_sha1" = "$expected_sha1"
          echo "Release APK signature matches the registered Android OAuth SHA-1." >> "$GITHUB_STEP_SUMMARY"

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android 15 emulator startup smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -euo pipefail
            adb wait-for-device
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            start_output="$(adb shell am start -W -n com.wayward.launcher.official.debug/com.wayward.launcher.MainActivity 2>&1)" || {
              printf '%s\n' "$start_output"
              adb logcat -d -s AndroidRuntime:E || true
              exit 1
            }
            printf '%s\n' "$start_output"
            sleep 8
            app_pid="$(adb shell pidof -s com.wayward.launcher.official.debug 2>/dev/null | tr -d '\r' || true)"
            crash_log="$(adb logcat -d -s AndroidRuntime:E 2>&1 || true)"
            if [[ -z "$app_pid" ]]; then
              echo "Launcher process was not running after Activity start."
              adb shell dumpsys activity activities | grep -E 'mResumedActivity|ResumedActivity' || true
              printf '%s\n' "$crash_log"
              exit 1
            fi
            if printf '%s' "$crash_log" | grep -q "Process: com.wayward.launcher.official.debug"; then
              printf '%s\n' "$crash_log"
              exit 1
            fi
            echo "Android 15 emulator launched the official launcher process (pid $app_pid)."

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: wayward-launcher-official-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
