name: WAL Android WAN signed validation

on:
  workflow_dispatch:
  push:
    branches:
      - work/wal-android-wan-signed-validation-20261120
    paths:
      - RUN_WAL_ANDROID_WAN_VALIDATION.txt

permissions:
  contents: read

concurrency:
  group: wal-android-wan-signed-validation
  cancel-in-progress: true

jobs:
  signed-wan-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      WAL_RELEASE_VERSION: 1.0.0
      WAL_ANDROID_DEVELOPMENT_COMMIT: f8149f4007f295126d52b270f49068c7a120edf9

    steps:
      - name: Checkout signed validation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      - name: Install Android SDK packages
        shell: bash
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-provider: basic

      - name: Embed pinned NovelAI image-generation backend
        shell: bash
        run: |
          set -euo pipefail
          source_commit="26d6c32e0b0abbb886e3029efd548b7ca6774401"
          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/diethoon/wayward/$source_commit/mods.zip" \
            -o "$RUNNER_TEMP/wayward-mods.zip"
          python3 scripts/embed_imagegen_backend.py "$RUNNER_TEMP/wayward-mods.zip"

      - name: Run full Android source contract suite
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          node --check app/src/main/assets/wayward-google-auth-bridge.js
          node --check app/src/main/assets/imagegen-studio-bridge.js
          node --check app/src/main/assets/imagepack-folder-picker.js
          node --check app/src/main/assets/wayward-download-bridge.js
          node scripts/test-google-auth-bridge.cjs
          node tests/cloudsave-native-auth-selection.test.cjs
          node scripts/test-official-scope.cjs
          node tests/remote-play-contract.test.cjs
          node tests/imagegen-studio-mode.test.mjs
          node tests/novelai-provider-lock.test.mjs
          node tests/novelai-token-persistence.test.mjs
          node tests/web-file-chooser-contract.test.mjs
          node tests/wayward-source-contract.test.mjs
          node tests/imagepack-folder-picker-contract.test.mjs
          node tests/saf-picker-promise-resume-regression.test.mjs
          node tests/saf-directory-deadlock-regression.test.mjs
          node tests/wal-home-branding-contract.test.mjs
          node tests/file-access-engine-batch.test.mjs
          node tests/file-access-engine-policy.test.mjs
          node tests/faith-imagepack-upload-contract.test.mjs
          node tests/saf-image-fast-path.contract.test.cjs
          python3 -m py_compile scripts/check-glass-ui-layout.py
          python3 tests/android15-recents-parser.test.py
          test_dir="$RUNNER_TEMP/android-contract-tests"
          mkdir -p "$test_dir"
          javac -d "$test_dir" app/src/main/java/com/wayward/launcher/ImageServerModeCoordinator.java tests/ImageServerModeCoordinatorTest.java
          java -cp "$test_dir" com.wayward.launcher.ImageServerModeCoordinatorTest
          javac -d "$test_dir" app/src/main/java/com/wayward/launcher/WebFileChooserRequestPolicy.java tests/WebFileChooserRequestPolicyTest.java
          java -cp "$test_dir" com.wayward.launcher.WebFileChooserRequestPolicyTest
          javac -d "$test_dir" app/src/main/java/com/wayward/launcher/DiagnosticsUploadPolicy.java tests/DiagnosticsUploadPolicyTest.java
          java -cp "$test_dir" com.wayward.launcher.DiagnosticsUploadPolicyTest
          javac -d "$test_dir" app/src/main/java/com/wayward/launcher/SafImageDocumentResolver.java tests/SafImageDocumentResolverTest.java
          java -cp "$test_dir" com.wayward.launcher.SafImageDocumentResolverTest
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const client = fs.readFileSync('app/src/main/java/com/wayward/launcher/RemoteHostClient.java', 'utf8');
          const connection = fs.readFileSync('app/src/main/java/com/wayward/launcher/RemoteHostConnection.java', 'utf8');
          const discovery = fs.readFileSync('app/src/main/java/com/wayward/launcher/RemoteHostDiscovery.java', 'utf8');
          assert.ok(client.includes('refreshWanEndpointWithToken'));
          assert.ok(client.includes('candidates.add(host.wanBaseUrl)'));
          assert.ok(client.includes('candidates.add(host.lanBaseUrl)'));
          assert.ok(connection.includes('normalizeWanBaseUrl'));
          assert.ok(discovery.includes('refreshWanEndpoint(appContext, refreshed)'));
          console.log('Paired WAN reconnect source integration passed.');
          NODE

      - name: Prepare existing Android Release signing identity
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" ]]; then
            echo "Existing Release signing secrets are incomplete." >&2
            exit 1
          fi
          work_dir="$RUNNER_TEMP/wayward-release"
          mkdir -p "$work_dir"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$work_dir/uploaded.p12"
          chmod 600 "$work_dir/uploaded.p12"
          actual_bytes="$(wc -c < "$work_dir/uploaded.p12" | tr -d '[:space:]')"
          if [[ "$actual_bytes" != "2858" ]]; then
            echo "Existing Release P12 size mismatch: $actual_bytes bytes (expected 2858)." >&2
            exit 1
          fi
          openssl pkcs12 -in "$work_dir/uploaded.p12" -info -noout \
            -passin env:KEYSTORE_PASSWORD >/dev/null 2>"$work_dir/p12-check.log" || {
              echo "OpenSSL could not verify the existing Release P12 using ANDROID_KEYSTORE_PASSWORD." >&2
              cat "$work_dir/p12-check.log" >&2
              exit 1
            }
          openssl pkcs12 -in "$work_dir/uploaded.p12" -nocerts -nodes \
            -passin env:KEYSTORE_PASSWORD -out "$work_dir/release-key.pem"
          openssl pkcs12 -in "$work_dir/uploaded.p12" -clcerts -nokeys \
            -passin env:KEYSTORE_PASSWORD -out "$work_dir/release-cert.pem"
          chmod 600 "$work_dir/release-key.pem" "$work_dir/release-cert.pem"
          openssl pkey -in "$work_dir/release-key.pem" -noout -check >/dev/null
          key_public_hash="$(openssl pkey -in "$work_dir/release-key.pem" -pubout -outform DER | openssl dgst -sha256)"
          cert_public_hash="$(openssl x509 -in "$work_dir/release-cert.pem" -pubkey -noout | openssl pkey -pubin -outform DER | openssl dgst -sha256)"
          if [[ "$key_public_hash" != "$cert_public_hash" ]]; then
            echo "Existing Release private key does not match its certificate." >&2
            exit 1
          fi
          actual_sha1="$(openssl x509 -in "$work_dir/release-cert.pem" -noout -fingerprint -sha1 | sed 's/.*=//' | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          expected_sha1="D9BE7443EB247D27C958CC4250D7F5D1E078F740"
          if [[ "$actual_sha1" != "$expected_sha1" ]]; then
            echo "Existing Release certificate SHA-1 mismatch." >&2
            echo "Expected: $expected_sha1; actual: $actual_sha1" >&2
            exit 1
          fi
          openssl pkcs12 -export \
            -inkey "$work_dir/release-key.pem" \
            -in "$work_dir/release-cert.pem" \
            -name "$KEY_ALIAS" \
            -passout env:KEYSTORE_PASSWORD \
            -keypbe PBE-SHA1-3DES \
            -certpbe PBE-SHA1-3DES \
            -macalg sha1 \
            -out "$work_dir/java-compatible.p12"
          chmod 600 "$work_dir/java-compatible.p12"
          keytool -importkeystore -noprompt \
            -srckeystore "$work_dir/java-compatible.p12" \
            -srcstoretype PKCS12 \
            -srcstorepass "$KEYSTORE_PASSWORD" \
            -srcalias "$KEY_ALIAS" \
            -destkeystore "$work_dir/release.jks" \
            -deststoretype JKS \
            -deststorepass "$KEYSTORE_PASSWORD" \
            -destkeypass "$KEYSTORE_PASSWORD" \
            -destalias "$KEY_ALIAS"
          cert_info="$(keytool -list -v -keystore "$work_dir/release.jks" -storetype JKS -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS")"
          jks_sha1="$(printf '%s\n' "$cert_info" | awk '/SHA1:/ {print $2; exit}' | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          if [[ "$jks_sha1" != "$expected_sha1" ]]; then
            echo "Temporary JKS certificate SHA-1 mismatch." >&2
            exit 1
          fi
          chmod 600 "$work_dir/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$work_dir/release.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "Existing Release P12 validated; private key matched certificate and OAuth signer SHA-1." >> "$GITHUB_STEP_SUMMARY"

      - name: Build signed Android variants
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace clean testDebugUnitTest assembleDebug assembleRelease assembleOfficial \
            -PwalOfficialVersionName="$WAL_RELEASE_VERSION"

      - name: Verify and package signed Development WAN APK
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$ANDROID_HOME" ]]; then
            sdk="$ANDROID_HOME"
          else
            sdk="$ANDROID_SDK_ROOT"
          fi
          aapt="$sdk/build-tools/35.0.0/aapt"
          apksigner="$sdk/build-tools/35.0.0/apksigner"
          apk="app/build/outputs/apk/release/app-release.apk"
          if [[ ! -x "$aapt" || ! -x "$apksigner" || ! -f "$apk" ]]; then
            echo "Development Release APK or Android Build Tools are missing." >&2
            exit 1
          fi
          badging="$("$aapt" dump badging "$apk")"
          expected_identity="package: name='com.wayward.launcher.official' versionCode='109' versionName='1.0.9'"
          if ! grep -Fq "$expected_identity" <<< "$badging"; then
            echo "Development APK package/version mismatch." >&2
            printf '%s\n' "$badging" | head -n 8 >&2
            exit 1
          fi
          signature="$("$apksigner" verify --verbose --print-certs "$apk")"
          actual_sha1="$(printf '%s\n' "$signature" | awk -F': ' '/Signer #1 certificate SHA-1 digest:/ {gsub(/:/,"",$2); print toupper($2); exit}')"
          expected_sha1="D9BE7443EB247D27C958CC4250D7F5D1E078F740"
          if [[ "$actual_sha1" != "$expected_sha1" ]]; then
            echo "Development APK signer SHA-1 mismatch." >&2
            exit 1
          fi
          mkdir -p dist/development
          final_apk="WAL-Android-Launcher-Development-1.0.9.apk"
          cp "$apk" "dist/development/$final_apk"
          hash="$(sha256sum "dist/development/$final_apk" | awk '{print $1}')"
          printf '%s  %s\n' "$hash" "$final_apk" > dist/development/SHA256SUMS.txt
          echo "Signed Development WAN APK verified; SHA-256: $hash" >> "$GITHUB_STEP_SUMMARY"
          echo "PACKAGE=com.wayward.launcher.official VERSION=1.0.9 SIGNER_SHA1=$actual_sha1 SHA256=$hash"

      - name: Verify and package signed Official WAN APK
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$ANDROID_HOME" ]]; then
            sdk="$ANDROID_HOME"
          else
            sdk="$ANDROID_SDK_ROOT"
          fi
          aapt="$sdk/build-tools/35.0.0/aapt"
          apksigner="$sdk/build-tools/35.0.0/apksigner"
          apk_dir="app/build/outputs/apk/official"
          if [[ ! -x "$aapt" || ! -x "$apksigner" ]]; then
            echo "Android Build Tools 35.0.0 are unavailable."
            ls -la "$sdk/build-tools" || true
            exit 1
          fi
          apk_count="$(find "$apk_dir" -maxdepth 1 -type f -name '*.apk' | wc -l | tr -d '[:space:]')"
          if [[ "$apk_count" != "1" ]]; then
            echo "Expected exactly one Official APK in $apk_dir; found $apk_count." >&2
            find "$apk_dir" -maxdepth 1 -type f -print >&2 || true
            exit 1
          fi
          apk="$(find "$apk_dir" -maxdepth 1 -type f -name '*.apk' -print | head -n 1)"
          badging="$("$aapt" dump badging "$apk")"
          expected_identity="package: name='com.wayward.launcher.official.wal' versionCode='1' versionName='$WAL_RELEASE_VERSION'"
          if ! grep -Fq "$expected_identity" <<< "$badging"; then
            echo "Official APK package/version mismatch." >&2
            printf '%s\n' "$badging" | head -n 8 >&2
            exit 1
          fi
          signature="$("$apksigner" verify --verbose --print-certs "$apk")"
          actual_sha1="$(printf '%s\n' "$signature" | awk -F': ' '/Signer #1 certificate SHA-1 digest:/ {gsub(/:/,"",$2); print toupper($2); exit}')"
          expected_sha1="D9BE7443EB247D27C958CC4250D7F5D1E078F740"
          if [[ "$actual_sha1" != "$expected_sha1" ]]; then
            echo "Official APK signer SHA-1 mismatch." >&2
            exit 1
          fi
          mkdir -p dist/official
          final_apk="WAL-Android-Launcher-$WAL_RELEASE_VERSION.apk"
          cp "$apk" "dist/official/$final_apk"
          hash="$(sha256sum "dist/official/$final_apk" | awk '{print $1}')"
          printf '%s  %s\n' "$hash" "$final_apk" > dist/official/SHA256SUMS.txt
          echo "Signed Official WAN APK verified; SHA-256: $hash" >> "$GITHUB_STEP_SUMMARY"
          echo "PACKAGE=com.wayward.launcher.official.wal VERSION=$WAL_RELEASE_VERSION SIGNER_SHA1=$actual_sha1 SHA256=$hash"

      - name: Upload signed WAN validation APK
        uses: actions/upload-artifact@v4
        with:
          name: WAL-Android-Launcher-WAN-signed-${{ github.sha }}
          path: dist/**/*
          if-no-files-found: error
          retention-days: 7

      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/wayward-release"

  device-smoke:
    name: Samsung SM-S938N install and launch smoke test
    runs-on: [self-hosted, Windows, X64, wal-android]
    needs: signed-wan-validation
    if: ${{ needs.signed-wan-validation.result == 'success' }}
    timeout-minutes: 25
    env:
      WAL_RELEASE_VERSION: 1.0.0
      ANDROID_HOME: 'C:\Users\Admin\.android\sdk'
    steps:
      - name: Download signed APKs from this run
        uses: actions/download-artifact@v4
        with:
          name: WAL-Android-Launcher-WAN-signed-${{ github.sha }}
          path: dist

      - name: Detect Samsung and install without touching app data
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $adb = Get-Command adb -ErrorAction SilentlyContinue
          if ($null -eq $adb) {
            $candidate = Join-Path $env:ANDROID_HOME "platform-tools/adb.exe"
            if (-not (Test-Path $candidate)) { throw "ADB is unavailable on the Android runner." }
            $adbPath = $candidate
          } else { $adbPath = $adb.Source }
          $listed = & $adbPath devices -l
          $serials = @($listed | ForEach-Object {
            if ($_ -match '^(\S+)\s+device(?:\s|$)') { $Matches[1] }
          })
          $serial = $null
          foreach ($candidateSerial in $serials) {
            $model = (& $adbPath -s $candidateSerial shell getprop ro.product.model 2>$null | Out-String).Trim()
            if ($model -match 'SM.?S938N') { $serial = $candidateSerial; break }
          }
          if (-not $serial) {
            "SM-S938N physical test: SKIPPED - no authorized matching device attached." | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
            Write-Host "ADB_DEVICES_BEGIN"
            $listed | ForEach-Object { Write-Host $_ }
            Write-Host "ADB_DEVICES_END"
            exit 0
          }
          Write-Host "TARGET_DEVICE=$serial MODEL=SM-S938N"
          $official = "dist/official/WAL-Android-Launcher-$env:WAL_RELEASE_VERSION.apk"
          $development = "dist/development/WAL-Android-Launcher-Development-1.0.9.apk"
          foreach ($entry in @(
            @{Package="com.wayward.launcher.official.wal"; VersionCode=1; Apk=$official},
            @{Package="com.wayward.launcher.official"; VersionCode=109; Apk=$development}
          )) {
            if (-not (Test-Path $entry.Apk)) { throw "Missing APK: $($entry.Apk)" }
            $installed = (& $adbPath -s $serial shell dumpsys package $entry.Package 2>$null | Out-String)
            $versionMatch = [regex]::Match($installed, 'versionCode=(\d+)')
            if ($versionMatch.Success -and [long]$versionMatch.Groups[1].Value -gt [long]$entry.VersionCode) {
              Write-Host "KEEP_NEWER_INSTALLED_PACKAGE=$($entry.Package) CURRENT=$($versionMatch.Groups[1].Value) CANDIDATE=$($entry.VersionCode)"
            } else {
              & $adbPath -s $serial install -r $entry.Apk
              if ($LASTEXITCODE -ne 0) { throw "Install failed for $($entry.Package)." }
            }
            $packagePath = (& $adbPath -s $serial shell pm path $entry.Package 2>$null | Out-String)
            if ($packagePath -notmatch 'package:') { throw "Package manager cannot resolve $($entry.Package)." }
            & $adbPath -s $serial shell monkey -p $entry.Package -c android.intent.category.LAUNCHER 1
            if ($LASTEXITCODE -ne 0) { throw "Launcher activity dispatch failed for $($entry.Package)." }
            Start-Sleep -Seconds 8
            $pid = (& $adbPath -s $serial shell pidof $entry.Package 2>$null | Out-String).Trim()
            if (-not $pid) { throw "Application process did not remain alive after launch: $($entry.Package)." }
            Write-Host "DEVICE_LAUNCH_PASS PACKAGE=$($entry.Package) PID=$pid"
          }
          $crashes = (& $adbPath -s $serial logcat -d -t 2500 2>$null | Select-String 'FATAL EXCEPTION|Fatal signal' | Out-String)
          if ($crashes -match 'com\.wayward\.launcher') { throw "AndroidRuntime fatal crash detected in the launcher logcat." }
          "SM-S938N physical test: PASS - both package IDs installed/resolved and launcher processes remained alive; app data was not cleared." | Tee-Object -FilePath $env:GITHUB_STEP_SUMMARY -Append
