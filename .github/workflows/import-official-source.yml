name: Build official launcher v1

on:
  push:
    branches: [main]
    paths:
      - BUILD_OFFICIAL_V1.txt
      - .github/workflows/import-official-source.yml
  workflow_dispatch:
    inputs:
      source_branch:
        description: Official source branch to build
        required: true
        default: work/official-v1-bootstrap-20261111
        type: string

permissions:
  contents: read

concurrency:
  group: official-v1-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated official source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_branch || 'work/official-v1-bootstrap-20261111' }}
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reuse stable test signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: wayward-launcher-official-debug-keystore-v1

      - name: Prepare optional release signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/wayward-release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/wayward-release.jks" >> "$GITHUB_ENV"
          else
            echo "No release keystore secret configured; Release APK will remain unsigned."
          fi

      - name: Build official APKs
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle --version
          gradle :app:assembleDebug :app:assembleRelease
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk
          else
            echo "Release build is unsigned; configure the four ANDROID_KEYSTORE_* repository secrets for a signed release."
          fi

      - name: Upload debug and release APKs
        uses: actions/upload-artifact@v4
        with:
          name: wayward-launcher-official-1.0.0-build
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14
