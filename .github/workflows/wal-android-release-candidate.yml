name: WAL Android Official signed release candidate

on:
  push:
    branches:
      - work/wal-android-release-builder-20261120
    paths:
      - RUN_WAL_ANDROID_RELEASE_BUILD.txt

permissions:
  contents: read

concurrency:
  group: wal-android-release-candidate
  cancel-in-progress: false

jobs:
  signed-release-candidate:
    runs-on: [self-hosted, Windows, X64, wal-android]
    timeout-minutes: 75
    env:
      ANDROID_HOME: C:\Users\Admin\.android\sdk
      ANDROID_SDK_ROOT: C:\Users\Admin\.android\sdk
      ANDROID_KEYSTORE_BASE64: \${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: \${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: \${{ secrets.ANDROID_KEY_ALIAS }}
      WAL_ANDROID_BRANCH: work/android-product-split-v1.3-20261120
      WAL_ANDROID_COMMIT: 412c34afe84974413c222833077b71ec37275d58
      WAL_RELEASE_VERSION: 1.0.0

    steps:
      - name: Checkout isolated release-builder workflow
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-provider: basic

      - name: Verify existing cross-repository access
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Get-Command gh -ErrorAction SilentlyContinue)) { throw "Existing GitHub CLI is unavailable on the Android runner." }
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) { throw "One-shot runner did not inherit its scoped GitHub CLI token." }
          Write-Output "::add-mask::$env:GH_TOKEN"
          gh auth status
          if ($LASTEXITCODE -ne 0) { throw "The runner's existing GitHub CLI authentication is unavailable." }
          gh api repos/wal-studio/WAL-Android-Development --jq .full_name
          if ($LASTEXITCODE -ne 0) { throw "The runner cannot read WAL-Android-Development." }
          gh api repos/wal-studio/WAL-Official-Releases --jq .full_name
          if ($LASTEXITCODE -ne 0) { throw "The runner cannot access WAL-Official-Releases." }

      - name: Prepare existing Android signing identity from source repository secrets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($name in @("ANDROID_KEYSTORE_BASE64","ANDROID_KEYSTORE_PASSWORD","ANDROID_KEY_ALIAS")) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Existing source-repository signing secret is missing: $name"
            }
          }
          $opensslCommand = Get-Command openssl -ErrorAction SilentlyContinue
          if ($null -eq $opensslCommand) {
            $gitOpenSsl = Join-Path $env:ProgramFiles "Git/usr/bin/openssl.exe"
            if (Test-Path $gitOpenSsl) { $opensslPath = $gitOpenSsl } else { throw "OpenSSL is unavailable." }
          } else { $opensslPath = $opensslCommand.Source }
          $workDir = Join-Path $env:RUNNER_TEMP "wal-official-release-signing"
          New-Item -ItemType Directory -Force -Path $workDir | Out-Null
          $p12 = Join-Path $workDir "existing-release.p12"
          [IO.File]::WriteAllBytes($p12,[Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64))
          & $opensslPath pkcs12 -in $p12 -info -noout -passin env:ANDROID_KEYSTORE_PASSWORD 2>$null
          if ($LASTEXITCODE -ne 0) { throw "Existing release P12 password verification failed." }
          $keyPem = Join-Path $workDir "release-key.pem"
          $certPem = Join-Path $workDir "release-cert.pem"
          & $opensslPath pkcs12 -in $p12 -nocerts -nodes -passin env:ANDROID_KEYSTORE_PASSWORD -out $keyPem
          if ($LASTEXITCODE -ne 0) { throw "Existing release private key extraction failed." }
          & $opensslPath pkcs12 -in $p12 -clcerts -nokeys -passin env:ANDROID_KEYSTORE_PASSWORD -out $certPem
          if ($LASTEXITCODE -ne 0) { throw "Existing release certificate extraction failed." }
          $sha1Line = & $opensslPath x509 -in $certPem -noout -fingerprint -sha1
          $actualSha1 = (($sha1Line -split "=")[-1] -replace ":", "").ToUpperInvariant()
          $expectedSha1 = "D9BE7443EB247D27C958CC4250D7F5D1E078F740"
          if ($actualSha1 -ne $expectedSha1) { throw "Existing release signer does not match the registered SHA-1." }
          $compatibleP12 = Join-Path $workDir "java-compatible.p12"
          & $opensslPath pkcs12 -export -inkey $keyPem -in $certPem -name $env:ANDROID_KEY_ALIAS -passout env:ANDROID_KEYSTORE_PASSWORD -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES -macalg sha1 -out $compatibleP12
          if ($LASTEXITCODE -ne 0) { throw "Java-compatible PKCS#12 conversion failed." }
          $jks = Join-Path $workDir "release.jks"
          & keytool -importkeystore -noprompt -srckeystore $compatibleP12 -srcstoretype PKCS12 -srcstorepass $env:ANDROID_KEYSTORE_PASSWORD -srcalias $env:ANDROID_KEY_ALIAS -destkeystore $jks -deststoretype JKS -deststorepass $env:ANDROID_KEYSTORE_PASSWORD -destkeypass $env:ANDROID_KEYSTORE_PASSWORD -destalias $env:ANDROID_KEY_ALIAS
          if ($LASTEXITCODE -ne 0) { throw "Existing release JKS conversion failed." }
          [IO.File]::AppendAllText($env:GITHUB_ENV,"ANDROID_KEYSTORE_PATH=$jks"+[char]10,[Text.UTF8Encoding]::new($false))
          Write-Host "Existing registered Release signer verified; key material remains in runner temp storage."

      - name: Clone and pin isolated Android Development commit
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          gh auth setup-git
          if ($LASTEXITCODE -ne 0) { throw "Could not configure the runner's existing GitHub CLI credential for Git." }
          $repoDir = Join-Path $env:RUNNER_TEMP "wal-android-development-release-build"
          if (Test-Path $repoDir) { Remove-Item -LiteralPath $repoDir -Recurse -Force }
          git clone --single-branch --branch $env:WAL_ANDROID_BRANCH https://github.com/wal-studio/WAL-Android-Development.git $repoDir
          if ($LASTEXITCODE -ne 0) { throw "Could not clone the isolated Android Development branch." }
          git -C $repoDir checkout --detach $env:WAL_ANDROID_COMMIT
          if ($LASTEXITCODE -ne 0) { throw "Could not pin the requested Android commit." }
          $actual = (git -C $repoDir rev-parse HEAD).Trim()
          if ($actual -ne $env:WAL_ANDROID_COMMIT) { throw "Android source commit mismatch: $actual" }
          Write-Host "Pinned Android source commit: $actual"
          [IO.File]::AppendAllText($env:GITHUB_ENV,"WAL_ANDROID_SOURCE_DIR=$repoDir"+[char]10,[Text.UTF8Encoding]::new($false))

      - name: Run product and CloudSave contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location $env:WAL_ANDROID_SOURCE_DIR
          node --check app/src/main/assets/wayward-google-auth-bridge.js
          if ($LASTEXITCODE -ne 0) { throw "Google auth bridge JavaScript syntax check failed." }
          node scripts/test-google-auth-bridge.cjs
          if ($LASTEXITCODE -ne 0) { throw "Google auth bridge contract failed." }
          node tests/cloudsave-native-auth-selection.test.cjs
          if ($LASTEXITCODE -ne 0) { throw "CloudSave native auth policy contract failed." }
          node scripts/test-product-split-v1.3.cjs
          if ($LASTEXITCODE -ne 0) { throw "Official product split contract failed." }
          node scripts/test-official-scope.cjs
          if ($LASTEXITCODE -ne 0) { throw "Development scope regression test failed." }

      - name: Build and test signed Android variants
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location $env:WAL_ANDROID_SOURCE_DIR
          gradle --no-daemon --stacktrace clean testDebugUnitTest assembleDebug assembleRelease assembleOfficial -PwalOfficialVersionName=$env:WAL_RELEASE_VERSION
          if ($LASTEXITCODE -ne 0) { throw "Android unit tests or signed variant builds failed." }

      - name: Package and verify Official release APK and checksum
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location $env:WAL_ANDROID_SOURCE_DIR
          & .\scripts\build-official-release-v1.3.ps1 -Version $env:WAL_RELEASE_VERSION
          if ($LASTEXITCODE -ne 0) { throw "Official signed release packaging failed." }
          $apk = Join-Path $PWD "dist/official/WAL-Android-Launcher-$env:WAL_RELEASE_VERSION.apk"
          $sum = Join-Path $PWD "dist/official/SHA256SUMS.txt"
          if (-not (Test-Path $apk) -or -not (Test-Path $sum)) { throw "Signed release APK or checksum file is missing." }
          $hash = (Get-FileHash -LiteralPath $apk -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "SIGNED OFFICIAL APK: $apk"
          Write-Host "SHA256: $hash"

      - name: Test Samsung SM-S938N over the existing ADB bridge when available
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location $env:WAL_ANDROID_SOURCE_DIR
          $adb = Join-Path $env:ANDROID_HOME "platform-tools/adb.exe"
          & $adb connect "192.168.0.3:45581" 2>&1 | Out-Null
          Start-Sleep -Seconds 3
          $deviceLines = @(& $adb devices | Select-Object -Skip 1 | Where-Object { $_ -match "\sdevice$" })
          $target = $null
          foreach ($line in $deviceLines) {
            $serial = ($line -split "\s+")[0]
            $model = (& $adb -s $serial shell getprop ro.product.model).Trim()
            if ($model -eq "SM-S938N") { $target = $serial; break }
          }
          if ($null -eq $target) {
            $message = "SM-S938N physical test: SKIPPED — existing ADB bridge did not expose the device to the runner."
            Write-Host $message
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value $message
            exit 0
          }
          $api = (& $adb -s $target shell getprop ro.build.version.sdk).Trim()
          if ($api -ne "35") { throw "SM-S938N is not Android 15 / API 35: $api" }
          $debugApk = Join-Path $PWD "app/build/outputs/apk/debug/app-debug.apk"
          $releaseApks = @(Get-ChildItem -LiteralPath "app/build/outputs/apk/release" -Filter "*.apk" -File)
          $officialApk = Join-Path $PWD "dist/official/WAL-Android-Launcher-$env:WAL_RELEASE_VERSION.apk"
          if ($releaseApks.Count -ne 1) { throw "Expected one signed Development Release APK." }
          foreach ($apk in @($debugApk,$releaseApks[0].FullName,$officialApk)) {
            & $adb -s $target install -r $apk
            if ($LASTEXITCODE -ne 0) { throw "APK install failed: $apk" }
          }
          $packages = (& $adb -s $target shell pm list packages | Out-String)
          foreach ($package in @("com.wayward.launcher.official.debug","com.wayward.launcher.official","com.wayward.launcher.official.wal")) {
            if ($packages -notmatch [regex]::Escape("package:"+$package)) { throw "Co-install package missing: $package" }
          }
          & $adb -s $target shell monkey -p com.wayward.launcher.official.wal 1
          if ($LASTEXITCODE -ne 0) { throw "Official launcher did not start on SM-S938N." }
          $message = "SM-S938N physical test: PASS — Development Debug, Development Release, and Official coexist; Official launcher started."
          Write-Host $message
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value $message

      - name: Create or update private draft release with signed assets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location $env:WAL_ANDROID_SOURCE_DIR
          $tag = "v$env:WAL_RELEASE_VERSION"
          $apk = Join-Path $PWD "dist/official/WAL-Android-Launcher-$env:WAL_RELEASE_VERSION.apk"
          $sum = Join-Path $PWD "dist/official/SHA256SUMS.txt"
          $draftState = & gh release view $tag --repo wal-studio/WAL-Official-Releases --json isDraft --jq .isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if ($draftState.Trim() -ne "true") { throw "Refusing to overwrite an already published stable release." }
            & gh release upload $tag $apk $sum --repo wal-studio/WAL-Official-Releases --clobber
          } else {
            & gh release create $tag $apk $sum --repo wal-studio/WAL-Official-Releases --draft --target main --title "WAL Android Launcher $env:WAL_RELEASE_VERSION" --notes "Draft signed release candidate built from WAL-Android-Development commit $env:WAL_ANDROID_COMMIT. This draft is not publicly published. Validate OAuth registration for package com.wayward.launcher.official.wal before publishing."
          }
          if ($LASTEXITCODE -ne 0) { throw "Could not stage the signed APK in WAL-Official-Releases." }
          $message = "Signed Official APK and SHA256SUMS.txt staged in draft release $tag; not publicly published."
          Write-Host $message
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value $message

      - name: Remove temporary signing material
        if: always()
        shell: pwsh
        run: |
          $signingDir = Join-Path $env:RUNNER_TEMP "wal-official-release-signing"
          if (Test-Path $signingDir) { Remove-Item -LiteralPath $signingDir -Recurse -Force }
