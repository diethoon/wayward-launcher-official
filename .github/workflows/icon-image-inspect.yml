name: Inspect launcher icon source
on:
  push:
    branches:
      - work/official-image-prefetch-depth-20261112
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Render a small inspection preview
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          im = Image.open("1794430759353.png").convert("RGB")
          im.thumbnail((320, 320), Image.Resampling.LANCZOS)
          im.save("icon-source-preview.jpg", quality=72, optimize=True)
          print(f"source_size={Image.open('1794430759353.png').size}")
          print(f"preview_size={im.size}")
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: icon-source-preview
          path: icon-source-preview.jpg
          retention-days: 2
