name: Verify preserved Android file-engine v2
on:
  push:
    branches:
      - recovery/android-file-engine-v2-original-20261119
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify source SHA-256 and byte sizes
        run: |
          set -euo pipefail
          sha256sum -c <<'SHA256'
          41e54271031f2497c7974fdeff0772c82885bee5a00ce61f83e495db060a8c4e  app/src/main/assets/imagepack-folder-picker.js
          464c1a122b9d89177fb06a46e8b30ca1df3b55095ce62e677d2e34747b339ed6  app/src/main/java/com/wayward/launcher/ImagePackDirectoryAccess.java
          5777b8339548afdc22502d702ba00512dbe5a373ebd858674d8c34b879aab9fc  .github/workflows/android-validation.yml
          9089a62ad05126f6b8899be3f0eb8cb4c7652916285060c4c741fff9512cb550  tests/file-access-engine-policy.test.mjs
          a1cc134b4a717dc415eb225a5efbaa18849da672dd8ec3daf53a079ea558a443  docs/android-file-access-engine-v2.md
          SHA256
          test "$(wc -c < app/src/main/assets/imagepack-folder-picker.js)" -eq 45444
          test "$(wc -c < app/src/main/java/com/wayward/launcher/ImagePackDirectoryAccess.java)" -eq 53123
          test "$(wc -c < .github/workflows/android-validation.yml)" -eq 14902
          test "$(wc -c < tests/file-access-engine-policy.test.mjs)" -eq 4997
          test "$(wc -c < docs/android-file-access-engine-v2.md)" -eq 3440
      - name: Run source checks
        run: |
          node --check app/src/main/assets/imagepack-folder-picker.js
          node tests/file-access-engine-policy.test.mjs
          git diff --check
