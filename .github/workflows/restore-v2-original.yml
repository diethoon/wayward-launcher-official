name: Restore verified Android file-engine v2 source
on:
  push:
    branches:
      - recovery/android-file-engine-v2-original-20261119
    paths:
      - .recovery/ASSEMBLE_NOW
permissions:
  contents: write
jobs:
  restore-original:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - name: Reassemble original source from staged byte chunks
        shell: bash
        run: |
          set -euo pipefail
          assemble() {
            local key="$1" parts="$2" target="$3"
            mkdir -p "$(dirname "$target")"
            : > "$target"
            for ((i=0; i<parts; i++)); do
              part=".recovery/v2-original-chunks/${key}-part$(printf '%02d' "$i").b64"
              test -s "$part"
              while IFS= read -r encoded; do
                printf '%s' "$encoded" | base64 --decode >> "$target"
              done < "$part"
            done
          }
          assemble 3de51d350657 3 app/src/main/assets/imagepack-folder-picker.js
          assemble fb6ffea4ff12 3 app/src/main/java/com/wayward/launcher/ImagePackDirectoryAccess.java
          assemble 5cc491696af3 1 .github/workflows/android-validation.yml
          assemble 104d83944559 1 tests/file-access-engine-policy.test.mjs
          assemble 0b91089a45b9 1 docs/android-file-access-engine-v2.md
          sha256sum -c <<'SHA256'
          41e54271031f2497c7974fdeff0772c82885bee5a00ce61f83e495db060a8c4e  app/src/main/assets/imagepack-folder-picker.js
          464c1a122b9d89177fb06a46e8b30ca1df3b55095ce62e677d2e34747b339ed6  app/src/main/java/com/wayward/launcher/ImagePackDirectoryAccess.java
          5777b8339548afdc22502d702ba00512dbe5a373ebd858674d8c34b879aab9fc  .github/workflows/android-validation.yml
          9089a62ad05126f6b8899be3f0eb8cb4c7652916285060c4c741fff9512cb550  tests/file-access-engine-policy.test.mjs
          a1cc134b4a717dc415eb225a5efbaa18849da672dd8ec3daf53a079ea558a443  docs/android-file-access-engine-v2.md
          SHA256
          node --check app/src/main/assets/imagepack-folder-picker.js
          node tests/file-access-engine-policy.test.mjs
          git diff --check
      - name: Commit exact source files and remove transfer staging
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/imagepack-folder-picker.js
          git add app/src/main/java/com/wayward/launcher/ImagePackDirectoryAccess.java
          git add .github/workflows/android-validation.yml
          git add tests/file-access-engine-policy.test.mjs docs/android-file-access-engine-v2.md
          git rm -r .recovery/v2-original-chunks
          git rm .recovery/ASSEMBLE_NOW
          git rm .github/workflows/import-file-engine-v2.yml || true
          git rm .github/workflows/restore-v2-original.yml || true
          git commit -m "recovery(android): preserve exact original file-engine v2 sources"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Preserve recovered v2 APKs as a CI artifact
        continue-on-error: true
        shell: bash
        env:
          SOURCE_BASE: https://sb-6ymgnrahggu0.vercel.run
        run: |
          mkdir -p recovered-apks
          curl --fail --silent --show-error --location "$SOURCE_BASE/Wayward-Android-v2.0-debug.apk" -o recovered-apks/Wayward-Android-v2.0-debug.apk
          curl --fail --silent --show-error --location "$SOURCE_BASE/Wayward-Android-v2.0-release-unsigned.apk" -o recovered-apks/Wayward-Android-v2.0-release-unsigned.apk
          echo "81fe595d457124c935feb08a08c29ea47ce0d1a82494d817237e1d09c18c64f5  recovered-apks/Wayward-Android-v2.0-debug.apk" | sha256sum -c -
          echo "56d61382773c699a4895f9f0352f295dad59deda416f677aa6805e587337c45e  recovered-apks/Wayward-Android-v2.0-release-unsigned.apk" | sha256sum -c -
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wayward-v2-original-apks
          path: recovered-apks/
          if-no-files-found: warn
          retention-days: 90
