name: Preserve recovered Android v2 APKs
on:
  push:
    branches:
      - recovery/android-file-engine-v2-original-20261119
permissions:
  contents: read
jobs:
  preserve:
    runs-on: ubuntu-latest
    steps:
      - name: Download and verify original APKs
        env:
          SOURCE_BASE: https://sb-4ijion0lps0x.vercel.run
        run: |
          set -euo pipefail
          mkdir -p recovered-apks
          curl --fail --silent --show-error --location "$SOURCE_BASE/Wayward-Android-v2.0-debug.apk" -o recovered-apks/Wayward-Android-v2.0-debug.apk
          curl --fail --silent --show-error --location "$SOURCE_BASE/Wayward-Android-v2.0-release-unsigned.apk" -o recovered-apks/Wayward-Android-v2.0-release-unsigned.apk
          echo "81fe595d457124c935feb08a08c29ea47ce0d1a82494d817237e1d09c18c64f5  recovered-apks/Wayward-Android-v2.0-debug.apk" | sha256sum -c -
          echo "56d61382773c699a4895f9f0352f295dad59deda416f677aa6805e587337c45e  recovered-apks/Wayward-Android-v2.0-release-unsigned.apk" | sha256sum -c -
      - uses: actions/upload-artifact@v4
        with:
          name: wayward-v2-original-apks
          path: recovered-apks/
          if-no-files-found: error
          retention-days: 90
