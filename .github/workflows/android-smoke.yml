name: Official launcher Android smoke test

on:
  push:
    branches: [main]
    paths:
      - RUN_ANDROID_SMOKE.txt
      - .github/workflows/android-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: official-android-smoke
  cancel-in-progress: true

jobs:
  android-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout official working branch
        uses: actions/checkout@v4
        with:
          ref: work/official-v1-bootstrap-20261111

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reuse stable test signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: wayward-launcher-official-debug-keystore-v1

      - name: Verify native OAuth bridge JavaScript
        run: node --check app/src/main/assets/wayward-google-auth-bridge.js
        # The next step checks event.origin/source/nonce and native result handoff.
      - name: Test native OAuth popup compatibility bridge
        run: node scripts/test-google-auth-bridge.cjs

      - name: Build official debug APK
        run: gradle :app:assembleDebug

      - name: Verify APK package, version, and signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | tee /tmp/apk-badging.txt
          grep -q "package: name='com.wayward.launcher.official.debug' versionCode='100' versionName='1.0.0-debug'" /tmp/apk-badging.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk

      - name: Print debug certificate fingerprint for Google Cloud Android client
        run: |
          echo "Android debug keystore files:"
          find "$HOME/.android" -maxdepth 2 -type f -name '*.keystore' -print || true
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk

      - name: Install and launch on Android 15 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop com.wayward.launcher.official.debug
            adb shell am start -W -n com.wayward.launcher.official.debug/com.wayward.launcher.MainActivity
            sleep 4
            adb shell pidof com.wayward.launcher.official.debug
            adb logcat -d -s AndroidRuntime:E

      - name: Upload official debug test APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wayward-launcher-official-1.0.0-debug-test
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 14
