plugins { id 'com.android.application' }

def releaseSigningReady = [
    System.getenv('ANDROID_KEYSTORE_PATH'),
    System.getenv('ANDROID_KEYSTORE_PASSWORD'),
    System.getenv('ANDROID_KEY_ALIAS')
].every { value -> value != null && !value.trim().isEmpty() }
android {
    buildFeatures { buildConfig true }
    namespace 'com.wayward.launcher'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'com.wayward.launcher.official'
        minSdk 29
        targetSdk 35
        versionCode 109
        versionName '1.0.9'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        release {
            if (releaseSigningReady) {
                storeFile file(System.getenv('ANDROID_KEYSTORE_PATH'))
                storeType 'JKS'
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
            buildConfigField 'boolean', 'WAL_OFFICIAL', 'false'
            manifestPlaceholders = [appLabel: 'WAL Development']
        }
        release {
            minifyEnabled false
            buildConfigField 'boolean', 'WAL_OFFICIAL', 'false'
            manifestPlaceholders = [appLabel: 'WAL Development']
            if (releaseSigningReady) signingConfig signingConfigs.release
        }
        official {
            initWith release
            applicationIdSuffix '.wal'
            buildConfigField 'boolean', 'WAL_OFFICIAL', 'true'
            manifestPlaceholders = [appLabel: 'WAL Android Launcher']
        }
    }
}
def officialVersionName = (findProperty('walOfficialVersionName') ?: '1.0.0').toString()
def officialVersionMatcher = officialVersionName =~ /^(\d+)\.(\d+)\.(\d+)$/
if (!officialVersionMatcher.matches()) {
    throw new GradleException("walOfficialVersionName must use MAJOR.MINOR.PATCH.")
}
def officialMajor = officialVersionMatcher[0][1].toLong()
def officialMinor = officialVersionMatcher[0][2].toLong()
def officialPatch = officialVersionMatcher[0][3].toLong()
if (officialMajor < 1L || officialMinor >= 1000L || officialPatch >= 1000L) {
    throw new GradleException("Official version must have MAJOR >= 1 and MINOR/PATCH < 1000.")
}
def officialVersionCodeLong = 1L + (officialMajor - 1L) * 1_000_000L + officialMinor * 1_000L + officialPatch
if (officialVersionCodeLong > 2_100_000_000L) {
    throw new GradleException("Official versionCode exceeds Android's supported range.")
}
def officialVersionCode = officialVersionCodeLong.toInteger()

androidComponents {
    onVariants(selector().withBuildType("official")) { variant ->
        variant.outputs.each { output ->
            output.versionCode.set(officialVersionCode)
            output.versionName.set(officialVersionName)
        }
    }
}
dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'com.google.android.gms:play-services-auth:21.6.0'
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
    implementation 'com.google.android.gms:play-services-mlkit-barcode-scanning:18.3.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}


tasks.withType(org.gradle.api.tasks.testing.Test).configureEach {
    maxHeapSize = '192m'
    maxParallelForks = 1
    jvmArgs '-XX:+UseSerialGC'
}
